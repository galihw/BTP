		.meja {
			position: absolute;

		btngKembali.style.backgroundImage = "url(../dataimage/btngKembali.png)";
		btngLanjut.style.left = (myBG.x+xyBtn[3][0]*scl)+'px';
		btngLanjut.style.top = (myBG.y+xyBtn[3][1]*scl)+'px';
		btngLanjut.style.backgroundImage = "url(../dataimage/btngLanjut.png)";
		
		var xyMenu = [[82.29,105.58],[211.82,211.82],[300.46,105.58],[409.54,211.82],[518.62,105.58],[627.7,211.82]];
		for(var i=1;i<=6;i++){
			document.getElementById("btn"+i).style.left = (myBG.x+xyMenu[i-1][0]*scl)+'px';
			document.getElementById("btn"+i).style.top = (myBG.y+xyMenu[i-1][1]*scl)+'px';
		}
	</script>
	<script>
		function ZoomAll(){
			let lebarJendela = window.innerWidth;
			let tinggiJendela = window.innerHeight;
			var xscale = lebarJendela/840;
			var yscale = tinggiJendela/472;
			fixscale = Math.min(xscale,yscale);
			fixzoom = fixscale*100;
			document.body.style.zoom = ""+fixzoom+"%";
			myBG.style.clipPath = "polygon(0 0, "+fixzoom+"% 0, "+fixzoom+"% "+fixzoom+"%, 0 "+fixzoom+"%)";
		}
		
		//ZoomAll();

	</script>
	<script>
		//function acak array
		function RandomMyArray(Arr){
			for (var i=0; i<Arr.length; i++){
				var r = Math.floor(Math.random() * Arr.length);
				var a = Arr[i];
				Arr[i] = Arr[r];
				Arr[r] = a;
			}
			return Arr;
		}
		function arraysAreEqual(arr1, arr2) {
			if (arr1.length !== arr2.length) {
			   return false;
			}
			return arr1.every((val, index) => val === arr2[index]);
		}
	</script>
